# Выкладка на Спринтхост: после каждого Merge в main GitHub сам собирает сайт и загружает его на хостинг по SSH.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SPRINTHOST_HOST     — адрес SSH-сервера из панели Спринтхоста
#   SPRINTHOST_USER     — логин хостинга
#   SPRINTHOST_SSH_KEY  — закрытый SSH-ключ (Спринтхост пускает по SSH только по ключу);
#                         открытая часть ключа лежит на хостинге в ~/.ssh/authorized_keys
#   SPRINTHOST_PASSWORD — запасной вариант вместо ключа, если хостинг разрешит вход по паролю
# Пока секретов нет, выкладка просто пропускается.
name: Выкладка на Спринтхост

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-sprinthost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SPRINTHOST_HOST }}
      USER_NAME: ${{ secrets.SPRINTHOST_USER }}
      SSHPASS: ${{ secrets.SPRINTHOST_PASSWORD }}
      SSH_KEY: ${{ secrets.SPRINTHOST_SSH_KEY }}
    steps:
      - name: Проверить, настроена ли выкладка
        id: check
        run: |
          if [ -n "$HOST" ] && [ -n "$USER_NAME" ] && { [ -n "$SSH_KEY" ] || [ -n "$SSHPASS" ]; }; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "Секреты SPRINTHOST_* не заданы — пропускаю выкладку."; fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'yes'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: 22
          cache: npm

      - name: Собрать сайт
        if: steps.check.outputs.ready == 'yes'
        run: |
          npm ci
          ./scripts/build-sprinthost.sh

      - name: Загрузить на Спринтхост
        if: steps.check.outputs.ready == 'yes'
        run: |
          # Лишние пробелы и переносы строк, случайно попавшие в секреты, убираем.
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')
          USER_NAME=$(printf '%s' "$USER_NAME" | tr -d '[:space:]')
          OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/sprinthost && chmod 600 ~/.ssh/sprinthost
            # Подсказки на случай ошибки: сам ключ не печатаем, только его отпечаток (он не секретный).
            if ! head -1 ~/.ssh/sprinthost | grep -q 'BEGIN .*PRIVATE KEY'; then
              echo "::error::В секрете SPRINTHOST_SSH_KEY не закрытый ключ. Нужно содержимое файла konspektor_deploy (без .pub), от строки -----BEGIN до строки -----END целиком."
              exit 1
            fi
            if ! ssh-keygen -y -f ~/.ssh/sprinthost > ~/.ssh/sprinthost.pub 2>/dev/null; then
              echo "::error::Ключ в SPRINTHOST_SSH_KEY повреждён (скопирован не целиком?). Вставьте файл konspektor_deploy заново."
              exit 1
            fi
            echo "Отпечаток ключа из секрета: $(ssh-keygen -lf ~/.ssh/sprinthost.pub)"
            echo "Логин из секрета SPRINTHOST_USER: ${#USER_NAME} символов (у вас должно быть 8)."
            SSH="ssh -i $HOME/.ssh/sprinthost -o IdentitiesOnly=yes -o BatchMode=yes $OPTS"
          else
            sudo apt-get install -y -qq sshpass > /dev/null
            SSH="sshpass -e ssh $OPTS"
          fi
          $SSH "$USER_NAME@$HOST" 'echo "Вход на хостинг по SSH работает"'
          # Распаковываем рядом, переносим .env.production с ключами (он живёт только на сервере) и подменяем папку целиком.
          tar czf - -C dist-sprinthost . | $SSH "$USER_NAME@$HOST" '
            set -e
            rm -rf ~/konspektor.new ~/konspektor.old
            mkdir -p ~/konspektor.new
            tar xzf - -C ~/konspektor.new
            if [ -f ~/konspektor/.env.production ]; then cp ~/konspektor/.env.production ~/konspektor.new/; else echo "Внимание: нет ~/konspektor/.env.production — создайте его по инструкции"; fi
            mkdir -p ~/konspektor.new/tmp
            if [ -d ~/konspektor ]; then mv ~/konspektor ~/konspektor.old; fi
            mv ~/konspektor.new ~/konspektor
            touch ~/konspektor/tmp/restart.txt
            rm -rf ~/konspektor.old
          '
          echo "Готово: сайт перезапущен."
